global:
  scrape_interval: 10s
  evaluation_interval: 10s

remote_write:
  - url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
    basic_auth:
      username: "3641293"
      password_file: /etc/prometheus/grafana_cloud_token.txt

scrape_configs:
  - job_name: "jurisai_backend"
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          application: "jurisai"
          environment: "docker"
