# ==============================================================================
# Render Blueprint Specification for JurisAI Backend
# ==============================================================================
services:
  - type: web
    name: jurisai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python build_vector_db.py"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: CORS_ORIGINS
        value: "*"
      - key: HOST
        value: 0.0.0.0
