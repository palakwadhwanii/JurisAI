# ==============================================================================
# Render Blueprint Specification for JurisAI
# Full Automatic Deployment Configuration for Backend & Optional Static Frontend
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Multi-Agent Legal Reasoning Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: jurisai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python build_vector_db.py"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: CORS_ORIGINS
        value: "*"
      - key: HOST
        value: 0.0.0.0

  # ----------------------------------------------------------------------------
  # 2. React (Vite) Frontend (For 1-Click All-in-One Render Deployment)
  # Note: If deploying frontend on Vercel, you can keep or ignore this service.
  # ----------------------------------------------------------------------------
  - type: static
    name: jurisai-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    branch: main
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jurisai-backend
          property: host
